coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 80%
        threshold: 5%

comment:
  layout: "condensed_header, diff, flags, files"
  behavior: default
  require_changes: false
  show_carryforward_flags: true

flag_management:
  default_rules:
    carryforward: true
