name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Build, test and pack without publishing'
        type: boolean
        default: true

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance via OIDC

jobs:
  release:
    # Only release after a green CI run on main (or a manual dispatch).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Dry run (pack only)
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run
        run: npm pack --dry-run --workspace=sep10-auth --workspace=sanctions-oracle --workspace=horizon-listener

      - name: Version PR or publish
        if: github.event_name != 'workflow_dispatch' || !inputs.dry-run
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: npm run release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
          NPM_CONFIG_ACCESS: public
