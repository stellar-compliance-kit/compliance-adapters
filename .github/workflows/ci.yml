name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-unit:
    name: Lint & Unit Tests (TypeScript)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (all packages)
        # Runs ESLint across sep10-auth/src, sanctions-oracle/src, and horizon-listener/src
        run: npm run lint

      - name: Format check
        # Verifies all .ts/.js files across every package match Prettier rules.
        # Fails the build if any file would be reformatted.
        run: npm run format:check

      - name: Check License Headers
        run: npm run check:license

      - name: Build
        run: npm run build

      - name: Unit Tests
        run: npm test -- --coverage

      - name: Report Coverage
        if: always()
        run: node scripts/report-coverage.js

      - name: Upload Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: |
            sep10-auth/coverage/
            sanctions-oracle/coverage/
            horizon-listener/coverage/

      - name: Audit dependencies
        run: npm audit --audit-level=high

  benchmark:
    name: Performance Benchmark (sep10-auth)
    runs-on: ubuntu-latest
    needs: test-unit
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run SEP-10 Challenge Throughput Benchmark
        id: benchmark
        run: npm run bench --workspace=sep10-auth

      - name: Comment benchmark results to job summary
        if: always()
        run: |
          echo "## SEP-10 Challenge Throughput Benchmark" >> $GITHUB_STEP_SUMMARY
          echo "Benchmark completed on: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "See logs above for ops/sec measurement." >> $GITHUB_STEP_SUMMARY

  test-e2e:
    name: End-to-End Integration Tests
    runs-on: ubuntu-latest
    needs: [test-unit, benchmark]
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run E2E Tests
        run: npm run test:e2e:ci
        env:
          # Pass contract ID if pre-deployed; otherwise tests will use placeholder
          TEST_CONTRACT_ID: ${{ secrets.TEST_CONTRACT_ID }}

  # No Rust/Soroban adapter contracts exist in this repo yet. If one is added
  # under a package with a Cargo.toml, add a matching `cargo test` job here.
