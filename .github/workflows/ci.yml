name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-ts:
    name: Lint & Test (TypeScript)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test --workspaces -- --coverage

      - name: Report Coverage
        if: always()
        run: node scripts/report-coverage.js

      - name: Upload Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: |
            sep10-auth/coverage/
            sanctions-oracle/coverage/
            horizon-listener/coverage/

  # No Rust/Soroban adapter contracts exist in this repo yet. If one is added
  # under a package with a Cargo.toml, add a matching `cargo test` job here.
