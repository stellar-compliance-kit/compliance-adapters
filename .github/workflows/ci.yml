name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-unit:
    name: Lint & Unit Tests (TypeScript)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit Tests
        run: npm test

  test-e2e:
    name: End-to-End Integration Tests
    runs-on: ubuntu-latest
    needs: test-unit
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run E2E Tests
        run: npm run test:e2e:ci
        env:
          # Pass contract ID if pre-deployed; otherwise tests will use placeholder
          TEST_CONTRACT_ID: ${{ secrets.TEST_CONTRACT_ID }}

  # No Rust/Soroban adapter contracts exist in this repo yet. If one is added
  # under a package with a Cargo.toml, add a matching `cargo test` job here.
